[versions]
java = "21"
folia = "1.21.11-R0.1-SNAPSHOT"
hikari = "7.1.0"
mariadb = "3.5.10"
junit = "5.11.4"
assertj = "3.27.3"
testcontainers = "1.21.4"
slf4j = "2.0.16"
shadow = "9.6.1"

[libraries]
folia-api = { module = "dev.folia:folia-api", version.ref = "folia" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
testcontainers-mariadb = { module = "org.testcontainers:mariadb", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
