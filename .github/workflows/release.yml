name: Release

# Tagging is the only trigger. Nothing publishes on a normal push, so this
# pipeline stays dormant until there is something real to ship.
#
#   v0.2.0                 → release every module that has shipped
#   molecule-npc-v0.2.0    → release that module alone
on:
  push:
    tags:
      - 'v*'
      - 'molecule-*-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # release notes are generated from history

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve tag
        id: tag
        run: .github/scripts/resolve-tag.sh "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build -PmoleculeVersion="${{ steps.tag.outputs.version }}" --stacktrace

      - name: Collect plugin jars
        id: jars
        run: .github/scripts/collect-jars.sh "${{ steps.tag.outputs.scope }}"

      - name: Generate release notes
        run: |
          .github/scripts/release-notes.sh \
            "${{ steps.tag.outputs.scope }}" \
            "${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${{ steps.tag.outputs.title }}" \
            --notes-file RELEASE_NOTES.md \
            dist/*.jar
